<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/soebis/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="soebis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Preconnect Google Fonts & Noto Emoji fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>RSUD dr. Soebandi Jember</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <div id="web-splash">
    <div class="splash-icon-box">
      <img src="favicon.png" alt="Logo RSUD dr. Soebandi" class="splash-logo-img">
    </div>
    <div class="splash-title">RSUD dr. Soebandi Jember</div>
    <div class="splash-subtitle">Sistem Informasi & Analytics Kinerja Pelayanan</div>
    <div class="splash-loader">
      <div class="splash-loader-bar"></div>
    </div>
    <div id="splash-status" class="splash-status-text">Memuat engine & modul aplikasi...</div>
  </div>

  <script>
    (function() {
      const steps = [
        "Memuat engine & modul Flutter...",
        "Menyiapkan konfigurasi sistem...",
        "Menghubungkan layanan API & data...",
        "Menyiapkan tampilan antarmuka..."
      ];
      let idx = 0;
      const el = document.getElementById('splash-status');
      if (el) {
        setInterval(function() {
          idx = (idx + 1) % steps.length;
          el.textContent = steps[idx];
        }, 1200);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
